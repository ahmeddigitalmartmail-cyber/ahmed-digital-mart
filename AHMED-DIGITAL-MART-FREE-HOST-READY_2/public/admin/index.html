<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AHMED DIGITAL & MART · Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<div id="login" class="login"><div class="login-card"><img src="/logo.png"><h1>Admin Panel</h1><p>AHMED DIGITAL & MART</p><form id="loginForm"><input id="username" placeholder="Username" value="admin" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><div id="loginError"></div></div></div>
<div id="app" class="hidden"><header><div class="wrap bar"><strong>AHMED DIGITAL & MART — Admin</strong><div><a href="/" target="_blank">Website</a><button id="logout">Logout</button></div></div></header>
<main class="wrap"><div class="tabs"><button data-tab="products">Products</button><button data-tab="orders">Orders</button></div>
<section id="productsTab"><div class="top"><h2>Products</h2><button id="newProduct" class="primary">+ Add Product</button></div><div id="productTable"></div></section>
<section id="ordersTab" class="hidden"><div class="top"><h2>Customer Orders</h2><button id="refreshOrders" class="primary">Refresh</button></div><div id="orderTable"></div></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Product</h2><button id="closeModal">✕</button></div><form id="productForm"><input type="hidden" id="pid"><label>Name<input id="pname" required></label><label>Description<textarea id="pdesc"></textarea></label><div class="two"><label>Price<input id="pprice" type="number" min="0" step="0.01" required></label><label>Stock<input id="pstock" type="number" min="0" step="1" required></label></div><label>Category<input id="pcat"></label><label>Product Photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label class="check"><input id="active" type="checkbox" checked> Active</label><button class="primary">Save Product</button></form></div></div>
<script src="/admin/admin.js"></script></body></html>
